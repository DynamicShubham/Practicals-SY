    <style>

            display:flex;
            justify-content:center;

        .container{

        }

        p{
            color:#666;
            margin-bottom:25px;
        }

            display:block;
            text-decoration:none;
            background:#4f46e5;
            color:#fff;
            padding:12px;

            transition:.3s;
            font-weight:bold;
        }

        .btn:hover{
            background:#3730a3;
            transform:translateY(-2px);
        }

            color:#888;
            font-size:13px;
